name: SDK starter checks
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          PAIFLOW_API_TOKEN: pfd_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PAIFLOW_DEPLOYMENT_ID: 12345678-1234-1234-1234-123456789abc
      - name: Check browser credential isolation
        run: node scripts/check-browser-bundle.mjs
